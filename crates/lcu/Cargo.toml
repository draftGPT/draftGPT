[package]
name = "lcu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
lcu-model.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

base64 = "0.22"
futures.workspace = true
reqwest = { workspace = true, features = ["json", "query", "rustls-no-provider"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sysinfo = "0.40.3"
tokio = { workspace = true, features = ["rt", "macros", "sync", "time", "net"] }
# `__rustls-tls` is tungstenite's internal (non-semver) feature for rustls
# without a root store; the public rustls features all pull one in, and we
# bring our own verifier.
tokio-tungstenite = { workspace = true, features = ["connect", "__rustls-tls"] }
tracing.workspace = true
x509-parser = { version = "0.18.1", features = ["verify"] }

[dev-dependencies]
rcgen = "0.14.10"
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
