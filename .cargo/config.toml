# TypeScript types generated from draft-core (`cargo test -p draft-core --features ts
# export_bindings`) go into the shared UI library, with i64 as `number` (the
# JSON the UIs receive has plain numbers).
[env]
TS_RS_EXPORT_DIR = { value = "ui/draft-ui/src/lib/types", relative = true }
TS_RS_LARGE_INT = "number"
