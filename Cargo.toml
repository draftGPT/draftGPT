[workspace]
resolver = "3"
members = ["crates/lcu-model", "crates/lcu", "crates/capture", "crates/devserver"]

[workspace.package]
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
lcu-model = { path = "crates/lcu-model" }
lcu = { path = "crates/lcu" }
capture = { path = "crates/capture" }
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
jiff = "0.2.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
# Without default features: no bundled TLS provider or root store, so no aws-lc
# in the Windows build. lcu adds its own rustls config (ring + Riot root).
reqwest = { version = "0.13.5", default-features = false }
tokio-tungstenite = { version = "0.30.0", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
